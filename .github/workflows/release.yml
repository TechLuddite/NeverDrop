name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack
        run: python3 scripts/pack.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeverDrop.vmz
          path: dist/NeverDrop.vmz
          if-no-files-found: error

      - name: Release if version is new
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/pack.py --print-version)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not retagging."
            exit 0
          fi
          gh release create "$TAG" dist/NeverDrop.vmz \
            --title "NeverDrop ${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
